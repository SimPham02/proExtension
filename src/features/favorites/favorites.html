<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager Pro</title>
    <script defer src="../../common/icons.js"></script>
    <link rel="stylesheet" href="favorites.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <i class="fa-solid fa-bolt-lightning"></i>
                <span>Pro Manager</span>
            </div>
            <div class="sidebar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="sidebar-search-input" placeholder="Search folders...">
            </div>
        </div>
        <div class="sidebar-content">
            <div class="folder-item" id="all-bookmarks-btn">
                <i class="fa-solid fa-house"></i>
                <span>All Bookmarks</span>
            </div>
            <div id="folder-tree-container"></div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Search bookmarks and folders...">
            </div>
            
            <button id="search-mode-btn" class="search-mode-btn" title="Group by Folder">
                <i class="fa-solid fa-layer-group"></i>
                <span>Group View</span>
            </button>
            
            <div class="controls">
                <select id="sort-select" class="sort-select">
                    <option value="name">Sort by Name</option>
                    <option value="date">Sort by Date</option>
                    <option value="url">Sort by URL</option>
                </select>

                <div class="view-toggles">
                    <div class="view-btn active" id="grid-view-btn" title="Grid View">
                        <i class="fa-solid fa-grip"></i>
                    </div>
                    <div class="view-btn" id="list-view-btn" title="List View">
                        <i class="fa-solid fa-list"></i>
                    </div>
                </div>

                <label class="toggle-container">
                    <span>Full Title on Hover</span>
                    <div class="switch">
                        <input type="checkbox" id="tooltip-toggle" checked>
                        <span class="slider"></span>
                    </div>
                </label>

                <div class="tools-dropdown">
                    <button class="btn-icon" id="tools-btn" title="Tools">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="tools-menu" id="tools-menu">
                        <div class="tool-item" id="find-duplicates-btn">
                            <i class="fa-solid fa-clone"></i>
                            <span>Find Duplicates</span>
                        </div>
                        <div class="tool-item" id="export-json-btn">
                            <i class="fa-solid fa-file-export"></i>
                            <span>Export JSON</span>
                        </div>
                        <div class="tool-item" id="cleanup-btn">
                            <i class="fa-solid fa-broom"></i>
                            <span>Cleanup Empty</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <section class="bookmarks-area">
            <div id="breadcrumbs" class="breadcrumbs"></div>
            <div class="section-header">
                <h2 id="current-folder-name">All Bookmarks</h2>
            </div>
            
            <div id="bookmarks-grid" class="bookmarks-grid">
                <!-- Bookmarks will be injected here -->
            </div>

            <div id="empty-msg" class="empty-state" style="display: none;">
                <i class="fa-solid fa-folder-open"></i>
                <p>No bookmarks found in this folder.</p>
            </div>
        </section>
    </main>

    <div class="selection-toolbar" id="selection-toolbar">
        <div class="toolbar-info">
            <span id="selected-count">0</span> items selected
        </div>
        <div class="toolbar-actions">
            <button class="toolbar-btn" id="bulk-delete-btn">
                <i class="fa-solid fa-trash"></i>
                <span>Delete</span>
            </button>
            <button class="toolbar-btn" id="bulk-cancel-btn">
                <i class="fa-solid fa-xmark"></i>
                <span>Cancel</span>
            </button>
        </div>
    </div>

    <script src="favorites.js"></script>
</body>
</html>
